name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: '1.25'
  CGO_ENABLED: '0'

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        go-version: ['1.25']
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        env:
          CGO_ENABLED: '1'
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.25'
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=10m

  vulncheck:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  build:
    name: Build
    needs: [test, lint, vulncheck]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -buildid=" ./...

      - name: Verify binaries
        run: |
          go build -trimpath -ldflags="-s -w -buildid=" -o syncmedia ./cmd/syncmedia
          test -x syncmedia
          ./syncmedia version

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up cosign
        uses: sigstore/cosign-installer@v3

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- APK 产物 ---
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Build APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          APK_OUTPUT: ${{ github.workspace }}/syncmedia.apk
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/Version=v2.0.0-android/Version=$GITHUB_REF_NAME/" scripts/build-apk.sh
          # CI 不需要本地 PATH 和 qemu
          sed -i '/export PATH=.*toolchain/d' scripts/build-apk.sh
          sed -i 's/QEMU="qemu-x86_64"/QEMU=""/' scripts/build-apk.sh
          sed -i 's/\$QEMU //g' scripts/build-apk.sh
          bash scripts/build-apk.sh

      - name: Verify APK
        run: bash scripts/verify-apk.sh syncmedia.apk

      - name: Upload APK to release
        uses: softprops/action-gh-release@v2
        with:
          files: syncmedia.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- KSU 模块产物 ---
      - name: Build KSU module
        run: |
          sed -i '/export PATH=.*toolchain/d' scripts/build-ksu.sh
          sed -i "s/Version=v2.0.0-ksu/Version=$GITHUB_REF_NAME/" scripts/build-ksu.sh
          bash scripts/build-ksu.sh

      - name: Upload KSU module to release
        uses: softprops/action-gh-release@v2
        with:
          files: syncmedia-ksu.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-apk:
    name: Build APK (verify)
    runs-on: ubuntu-latest
    if: "!startsWith(github.ref, 'refs/tags/v')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11076708'

      - name: Install Android SDK components
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Build APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          APK_OUTPUT: ${{ github.workspace }}/syncmedia.apk
        run: |
          # 移除本地环境专用设置
          sed -i '/export PATH=.*toolchain/d' scripts/build-apk.sh
          # CI 上 aapt2/zipalign 是原生 x86_64，不需要 qemu
          sed -i 's/QEMU="qemu-x86_64"/QEMU=""/' scripts/build-apk.sh
          sed -i 's/\$QEMU //g' scripts/build-apk.sh
          bash scripts/build-apk.sh

      - name: Verify APK
        run: bash scripts/verify-apk.sh syncmedia.apk

  build-ksu:
    name: Build KSU Module (verify)
    runs-on: ubuntu-latest
    if: "!startsWith(github.ref, 'refs/tags/v')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build KSU module
        run: |
          sed -i '/export PATH=.*toolchain/d' scripts/build-ksu.sh
          bash scripts/build-ksu.sh

      - name: Verify KSU module
        run: |
          test -f syncmedia-ksu.zip
          unzip -t syncmedia-ksu.zip
          unzip -l syncmedia-ksu.zip | grep -q "system/bin/syncmedia"
          echo "KSU module verification passed"